name: repo-check

on:
  # 不用 paths 过滤：required check 被 path 过滤跳过后会保持 Pending，阻塞 PR。
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Invariants
        run: python tools/repo-kit/check_repo.py --root .
      - name: Generated artifacts are up to date
        run: python tools/repo-kit/generate.py --root . --check
      - name: Kit lock
        run: pwsh tools/update-repo-kit.ps1 -Check
